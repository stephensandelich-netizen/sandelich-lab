sections:
  - title: Mission & Vision
    items:
      - title: Mission
        description: >-
          Reduce preventable harm by identifying substance use early,
          responding with evidence-aligned intervention, and strengthening
          connections between emergency and outpatient care.
      - title: Vision
        description: >-
          A care environment where adolescents receive immediate recognition,
          developmentally appropriate support, and clear linkage to sustained
          treatment pathways.
