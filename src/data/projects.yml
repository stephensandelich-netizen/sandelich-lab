- title: Substance Use Detection
  status: active
  period: Ongoing — Present
  description: >-
    Develops and tests screening tools and intervention protocols suitable
    for high-volume emergency department environments.
  badges:
    - Screening
    - Implementation Science
  highlights:
    - Feasibility of ED-based screening tools
    - Adolescent and caregiver perspectives on screening in pediatric EDs
    - Brief intervention design for acute care settings
    - Integration of screening into clinical workflows

- title: Opioid Use Disorder in the Pediatric Emergency Department
  status: active
  period: Ongoing — Present
  description: >-
    Examines acute opioid crises in adolescent patients and treatment
    implementation, anchored by a pending NIH K23 pilot randomized
    controlled trial of smartphone-delivered contingency management.
  badges:
    - Opioid Use Disorder
    - Harm Reduction
  highlights:
    - Acute opioid overdose presentations in pediatric patients
    - ED-initiated buprenorphine for adolescents with OUD
    - Prehospital opioid encounters and EMS response patterns
    - Naloxone distribution and harm reduction initiatives

- title: Social Vulnerability & Acute Care Outcomes
  status: active
  period: Ongoing — Present
  description: >-
    Investigates how social determinants — poverty, geography, adverse
    childhood experiences — intersect with substance use outcomes.
  badges:
    - Health Equity
    - Health Services Research
  highlights:
    - Social vulnerability index and pediatric EMS behavioral health activations
    - Adverse childhood experiences and emotional regulation
    - Geographic and socioeconomic disparities in opioid outcomes
    - Dual diagnoses of mental health and substance use disorder

- title: ED-to-Community Care Transitions
  status: active
  period: Ongoing — Present
  description: >-
    Develops pathways to maintain adolescent engagement after hospital
    discharge, connecting the emergency visit to sustained outpatient care.
  badges:
    - Care Transitions
    - Peer Recovery
  highlights:
    - Peer recovery navigator programs
    - Warm handoff protocols to outpatient providers
    - Healthcare utilization patterns among dually-diagnosed adolescents
    - Implementation science for care transition interventions
